<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Windows 右键菜单管理示意</title><desc id="desc">查看、禁用和恢复右键菜单项目</desc><rect width="1200" height="630" fill="#f7f9fc"/><text x="600" y="88" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Windows 右键菜单管理</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="100" y="145" width="430" height="400" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="145" y="190" width="340" height="56" rx="5" fill="#eef5ff"/><text x="175" y="226" font-size="22" fill="#1d4ed8">打开</text><text x="175" y="290" font-size="22" fill="#334155">复制文件地址</text><text x="175" y="354" font-size="22" fill="#334155">使用编辑器打开</text><text x="175" y="418" font-size="22" fill="#94a3b8">已禁用的冗余项目</text><line x1="145" y1="455" x2="485" y2="455" stroke="#e2e8f0"/><text x="175" y="505" font-size="22" fill="#334155">属性</text><rect x="650" y="175" width="430" height="330" rx="8" fill="#182230"/><text x="865" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">管理原则</text><circle cx="715" cy="302" r="18" fill="#22c55e"/><text x="752" y="310" font-size="23" fill="#f8fafc">先禁用，再观察</text><circle cx="715" cy="368" r="18" fill="#f59e0b"/><text x="752" y="376" font-size="23" fill="#f8fafc">保留恢复入口</text><circle cx="715" cy="434" r="18" fill="#3b82f6"/><text x="752" y="442" font-size="23" fill="#f8fafc">不要删除未知项</text></g></svg>

