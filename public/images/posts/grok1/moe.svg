<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Grok-1 混合专家架构</title><desc id="desc">路由器为每个 token 选择部分专家网络</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="88" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Grok-1：混合专家模型（MoE）</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="65" y="245" width="210" height="140" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="170" y="305" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">输入 Token</text><text x="170" y="348" text-anchor="middle" font-size="20" fill="#334155">每次只激活部分参数</text><path d="M295 315h95" stroke="#64748b" stroke-width="5"/><path d="m390 315-18-11v22z" fill="#64748b"/><rect x="415" y="220" width="230" height="190" rx="8" fill="#182230"/><text x="530" y="295" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">路由器</text><text x="530" y="342" text-anchor="middle" font-size="20" fill="#cbd5e1">选择合适的专家</text><path d="M665 270 790 175M665 305 790 285M665 340 790 395M665 375 790 505" stroke="#64748b" stroke-width="4"/><rect x="815" y="115" width="300" height="105" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="965" y="178" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">专家 1 · 参与计算</text><rect x="815" y="250" width="300" height="105" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="965" y="313" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">专家 2 · 参与计算</text><rect x="815" y="385" width="300" height="105" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="965" y="448" text-anchor="middle" font-size="25" fill="#64748b">其他专家 · 本次跳过</text></g><text x="600" y="570" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" fill="#52606d">总参数规模很大，但单次推理只使用被路由选中的专家</text></svg>

