<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Python 内置函数分类</title><desc id="desc">数据转换、迭代聚合、对象反射和输入输出四类内置函数</desc><rect width="1200" height="630" fill="#f7f9fc"/><text x="600" y="88" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Python 内置函数速览</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="85" y="155" width="480" height="170" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="325" y="213" text-anchor="middle" font-size="28" font-weight="700" fill="#1d4ed8">数据类型与转换</text><text x="325" y="264" text-anchor="middle" font-family="Consolas,monospace" font-size="23" fill="#334155">int · str · list · dict · set</text><rect x="635" y="155" width="480" height="170" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="875" y="213" text-anchor="middle" font-size="28" font-weight="700" fill="#15803d">迭代与聚合</text><text x="875" y="264" text-anchor="middle" font-family="Consolas,monospace" font-size="23" fill="#334155">range · zip · map · sum · sorted</text><rect x="85" y="380" width="480" height="170" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="325" y="438" text-anchor="middle" font-size="28" font-weight="700" fill="#c2410c">对象与反射</text><text x="325" y="489" text-anchor="middle" font-family="Consolas,monospace" font-size="23" fill="#334155">type · isinstance · getattr · dir</text><rect x="635" y="380" width="480" height="170" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/><text x="875" y="438" text-anchor="middle" font-size="28" font-weight="700" fill="#be185d">输入输出与执行</text><text x="875" y="489" text-anchor="middle" font-family="Consolas,monospace" font-size="23" fill="#334155">print · input · open · compile</text></g></svg>

