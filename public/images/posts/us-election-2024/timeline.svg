<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">2024 美国大选事件时间线</title><desc id="desc">拜登退选、支持哈里斯与民主党提名进程</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="88" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">2024 美国大选：民主党候选人更替</text><line x1="140" y1="330" x2="1060" y2="330" stroke="#64748b" stroke-width="6"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><circle cx="220" cy="330" r="20" fill="#2563eb"/><rect x="80" y="155" width="280" height="125" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="220" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">2024 年 7 月 21 日</text><text x="220" y="246" text-anchor="middle" font-size="21" fill="#334155">拜登宣布退出竞选</text><line x1="220" y1="280" x2="220" y2="310" stroke="#3b82f6" stroke-width="3"/><circle cx="600" cy="330" r="20" fill="#db2777"/><rect x="460" y="380" width="280" height="125" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/><text x="600" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="#be185d">同日</text><text x="600" y="471" text-anchor="middle" font-size="21" fill="#334155">公开支持哈里斯</text><line x1="600" y1="350" x2="600" y2="380" stroke="#db2777" stroke-width="3"/><circle cx="980" cy="330" r="20" fill="#16a34a"/><rect x="840" y="155" width="280" height="125" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="980" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#15803d">2024 年 7 月 22 日</text><text x="980" y="246" text-anchor="middle" font-size="21" fill="#334155">哈里斯称已获足够支持</text><line x1="980" y1="280" x2="980" y2="310" stroke="#16a34a" stroke-width="3"/></g><text x="600" y="575" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20" fill="#64748b">示意图依据文章所述公开事件整理</text></svg>

