<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Omakub 开发环境组成</title><desc id="desc">从 Ubuntu 到终端、编辑器、浏览器和开发工具的配置流程</desc><rect width="1200" height="630" fill="#f7f9fc"/><text x="600" y="95" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="46" font-weight="700" fill="#182230">Omakub：把 Ubuntu 变成开发工作站</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="90" y="230" width="230" height="170" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="205" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#c2410c">全新 Ubuntu</text><text x="205" y="345" text-anchor="middle" font-size="21" fill="#334155">干净的系统起点</text><path d="M340 315h95" stroke="#64748b" stroke-width="5"/><path d="m435 315-18-11v22z" fill="#64748b"/><rect x="460" y="200" width="280" height="230" rx="8" fill="#182230"/><text x="600" y="275" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">一条安装命令</text><text x="600" y="325" text-anchor="middle" font-family="Consolas,monospace" font-size="20" fill="#a7f3d0">omakub.org/install</text><text x="600" y="372" text-anchor="middle" font-size="20" fill="#cbd5e1">自动配置与统一默认值</text><path d="M760 315h95" stroke="#64748b" stroke-width="5"/><path d="m855 315-18-11v22z" fill="#64748b"/><rect x="880" y="165" width="230" height="300" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="995" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">开发工具箱</text><text x="995" y="280" text-anchor="middle" font-size="22" fill="#334155">终端与 Shell</text><text x="995" y="322" text-anchor="middle" font-size="22" fill="#334155">Neovim / VS Code</text><text x="995" y="364" text-anchor="middle" font-size="22" fill="#334155">浏览器与 Git</text><text x="995" y="406" text-anchor="middle" font-size="22" fill="#334155">平铺窗口工作流</text></g><text x="600" y="535" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" fill="#52606d">安装脚本会修改大量系统配置，建议先在虚拟机中体验</text></svg>

