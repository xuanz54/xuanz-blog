<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Vaultwarden 自托管架构</title><desc id="desc">客户端通过 HTTPS 和反向代理访问 Vaultwarden 与数据库</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="90" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Vaultwarden 自托管密码库</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="70" y="210" width="240" height="210" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="190" y="275" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">客户端</text><text x="190" y="325" text-anchor="middle" font-size="21" fill="#334155">浏览器扩展</text><text x="190" y="362" text-anchor="middle" font-size="21" fill="#334155">手机与桌面应用</text><path d="M330 315h100" stroke="#16a34a" stroke-width="6"/><path d="m430 315-20-12v24z" fill="#16a34a"/><text x="380" y="290" text-anchor="middle" font-size="18" fill="#15803d">HTTPS</text><rect x="455" y="210" width="250" height="210" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="580" y="275" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">Nginx / Caddy</text><text x="580" y="325" text-anchor="middle" font-size="21" fill="#334155">TLS 证书</text><text x="580" y="362" text-anchor="middle" font-size="21" fill="#334155">反向代理</text><path d="M725 315h95" stroke="#64748b" stroke-width="5"/><path d="m820 315-18-11v22z" fill="#64748b"/><rect x="845" y="175" width="285" height="280" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="988" y="242" text-anchor="middle" font-size="30" font-weight="700" fill="#c2410c">Vaultwarden</text><text x="988" y="294" text-anchor="middle" font-size="21" fill="#334155">Docker 容器</text><rect x="910" y="335" width="155" height="66" rx="7" fill="#182230"/><text x="988" y="376" text-anchor="middle" font-size="21" fill="#fff">加密数据库</text></g><text x="600" y="535" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" fill="#c2410c">必须配置 HTTPS、备份和管理员访问控制</text></svg>

