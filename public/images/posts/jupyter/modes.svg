<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Jupyter Notebook 两种模式</title><desc id="desc">编辑模式与命令模式的区别</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="88" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Jupyter Notebook 的两种工作模式</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="90" y="160" width="460" height="340" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="5"/><text x="320" y="225" text-anchor="middle" font-size="34" font-weight="700" fill="#15803d">编辑模式</text><text x="320" y="278" text-anchor="middle" font-size="24" fill="#334155">绿色边框 · Enter 进入</text><rect x="145" y="325" width="350" height="100" rx="6" fill="#fff" stroke="#22c55e" stroke-width="4"/><text x="175" y="385" font-family="Consolas,monospace" font-size="25" fill="#182230">print("hello")│</text><text x="320" y="468" text-anchor="middle" font-size="21" fill="#52606d">输入和修改单元格内容</text><rect x="650" y="160" width="460" height="340" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/><text x="880" y="225" text-anchor="middle" font-size="34" font-weight="700" fill="#1d4ed8">命令模式</text><text x="880" y="278" text-anchor="middle" font-size="24" fill="#334155">蓝色边框 · Esc 进入</text><rect x="705" y="325" width="350" height="100" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="4"/><text x="735" y="385" font-family="Consolas,monospace" font-size="25" fill="#182230">[1]  print("hello")</text><text x="880" y="468" text-anchor="middle" font-size="21" fill="#52606d">用快捷键操作整个单元格</text></g><text x="600" y="565" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" fill="#c2410c">先确认当前边框颜色，再使用快捷键</text></svg>

