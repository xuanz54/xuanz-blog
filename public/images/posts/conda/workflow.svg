<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Conda 环境管理流程</title><desc id="desc">创建、查看、激活、退出和删除环境的命令</desc><rect width="1200" height="630" fill="#f7f9fc"/><text x="600" y="86" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Conda 环境的完整生命周期</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="55" y="220" width="190" height="150" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="150" y="275" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">创建</text><text x="150" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#334155">conda create</text><path d="M260 295h65" stroke="#64748b" stroke-width="5"/><path d="m325 295-18-11v22z" fill="#64748b"/><rect x="340" y="220" width="190" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="435" y="275" text-anchor="middle" font-size="27" font-weight="700" fill="#6d28d9">查看</text><text x="435" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#334155">conda env list</text><path d="M545 295h65" stroke="#64748b" stroke-width="5"/><path d="m610 295-18-11v22z" fill="#64748b"/><rect x="625" y="220" width="190" height="150" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="720" y="275" text-anchor="middle" font-size="27" font-weight="700" fill="#15803d">激活</text><text x="720" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#334155">conda activate</text><path d="M830 295h65" stroke="#64748b" stroke-width="5"/><path d="m895 295-18-11v22z" fill="#64748b"/><rect x="910" y="220" width="235" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="1028" y="275" text-anchor="middle" font-size="27" font-weight="700" fill="#c2410c">退出 / 删除</text><text x="1028" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#334155">deactivate / env remove</text></g><rect x="175" y="450" width="850" height="78" rx="8" fill="#182230"/><text x="600" y="500" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" fill="#fff">每个项目使用独立环境，减少依赖冲突并提升可复现性</text></svg>

