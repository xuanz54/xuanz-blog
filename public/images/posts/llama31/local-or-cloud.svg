<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Llama 3.1 本地或云端运行选择</title><desc id="desc">根据硬件条件选择本地推理或 Hugging Face 云端体验</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="600" y="92" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#182230">Llama 3.1：选择合适的运行方式</text><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="450" y="145" width="300" height="115" rx="8" fill="#182230"/><text x="600" y="193" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">你的电脑有足够显存吗？</text><text x="600" y="232" text-anchor="middle" font-size="20" fill="#cbd5e1">模型越大，资源需求越高</text><path d="M520 260 295 350M680 260 905 350" stroke="#64748b" stroke-width="4"/><rect x="85" y="350" width="420" height="190" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="295" y="415" text-anchor="middle" font-size="32" font-weight="700" fill="#15803d">本地运行</text><text x="295" y="463" text-anchor="middle" font-size="22" fill="#334155">隐私更好 · 可离线 · 需要硬件</text><text x="295" y="505" text-anchor="middle" font-family="Consolas,monospace" font-size="20" fill="#166534">Ollama / llama.cpp</text><rect x="695" y="350" width="420" height="190" rx="8" fill="#eef5ff" stroke="#3b82f6" stroke-width="3"/><text x="905" y="415" text-anchor="middle" font-size="32" font-weight="700" fill="#1d4ed8">云端体验</text><text x="905" y="463" text-anchor="middle" font-size="22" fill="#334155">无需显卡 · 依赖网络与平台</text><text x="905" y="505" text-anchor="middle" font-size="20" fill="#1e40af">Hugging Face Chat</text></g><text x="295" y="326" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#15803d">有</text><text x="905" y="326" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">没有</text></svg>

